name: sync-espn

# Sincroniza os resultados da Copa (API pública da ESPN) para o nosso banco.
# Roda o scripts/sync-espn.mjs, que grava os placares dos 90 min em `matches`
# (status='finished') e dispara a apuração + ranking pelo trigger do Postgres.
#
# Repo público => minutos de Actions grátis e ilimitados.
# A senha de escrita vem do GitHub Secret SUPABASE_DB_PASSWORD (Settings >
# Secrets and variables > Actions). A ESPN não usa chave.

on:
  schedule:
    # A cada 10 min (horário UTC). O GitHub pode atrasar/agrupar rodadas
    # agendadas em horário de pico (pode virar ~10-20 min) — o admin sempre
    # pode lançar manualmente. Pra estreitar só pro horário dos jogos, troque
    # por algo como "*/10 14-23,0-8 * * *".
    - cron: "*/10 * * * *"
  workflow_dispatch: {} # permite rodar à mão pela aba Actions

# Não deixa duas rodadas se sobreporem se uma demorar mais que o intervalo.
concurrency:
  group: sync-espn
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write # pra abrir uma Issue se o sync falhar
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      # Sincroniza ONTEM e HOJE (UTC). Os jogos da Copa cruzam fusos UTC-7 a
      # UTC-4, então um jogo de fim de noite cai no "dia UTC seguinte"; cobrir
      # os dois dias garante que nenhum escape na virada de data. Re-gravar um
      # resultado já final é idempotente (mesmos valores, trigger recalcula
      # igual), então rodar a cada 10 min não causa efeito colateral.
      - name: Sincronizar ESPN (ontem + hoje, UTC)
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          node scripts/sync-espn.mjs "$(date -u -d 'yesterday' +%Y%m%d)"
          node scripts/sync-espn.mjs
          node scripts/resolve-teams.mjs --apply

      # Se qualquer passo acima falhar, abre uma Issue no repo (mais difícil de
      # ignorar que email). Dedup: só cria se não houver uma Issue aberta com o
      # rótulo `sync-failure` — evita spam quando a falha persiste por várias
      # rodadas. Feche a Issue ao resolver; a próxima falha abre uma nova.
      - name: Abrir Issue se o sync falhar
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'sync-failure';
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            if (open.data.length > 0) return; // já tem uma aberta
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 sync-espn falhou',
              labels: [label],
              body: `O sync da ESPN falhou. Veja os logs: ${url}\n\nEnquanto não resolver, lance resultados manualmente em /admin/resultados. Feche esta Issue quando o sync voltar a passar.`,
            });
